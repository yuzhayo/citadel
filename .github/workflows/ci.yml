name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  build:
    runs-on: windows-2025-vs2026
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 10.0.400

      - name: Restore
        shell: pwsh
        run: dotnet restore Citadel.slnx

      - name: Build and test
        shell: pwsh
        run: dotnet test Citadel.slnx --configuration Release --no-restore --nologo

      # Citizens are deliberately absent from Citadel.slnx (plug-and-play), which
      # used to let a broken citizen pass CI silently. Compile each one here (C6).
      - name: Build citizens
        shell: pwsh
        run: |
          dotnet build module/ftf/Module.FTF.csproj -v q --nologo
          dotnet build module/proxy/Module.Proxy.csproj -v q --nologo
          dotnet build module/blank/Module.Blank.csproj -v q --nologo
          dotnet build module/camoprof/Module.Camoprof.csproj -v q --nologo
          dotnet build module/mangareader/Module.Mangareader.csproj -v q --nologo
