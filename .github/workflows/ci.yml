name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  build:
    runs-on: windows-2025-vs2026
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 10.0.400

      - name: Restore
        shell: pwsh
        run: dotnet restore Citadel.slnx

      - name: Build and test
        shell: pwsh
        run: dotnet test Citadel.slnx --configuration Release --no-restore --nologo
